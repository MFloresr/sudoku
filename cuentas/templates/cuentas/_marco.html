{% extends "base.html" %}
{% load iconos %}
{% block content %}
<main class="mx-auto flex min-h-dvh max-w-sm flex-col gap-6 px-6 pt-16 pb-8">
  <div class="flex flex-col items-center gap-3.5 text-center">
    {% logo grande=True %}
    <h1 class="font-display text-[32px]">{% block titulo %}Sudoku{% endblock %}</h1>
    <p class="text-[15px] text-tenue">{% block subtitulo %}Tu partida y tus récords, guardados en tu cuenta.{% endblock %}</p>
  </div>
  {% block cuerpo %}{% endblock %}
</main>
{% endblock %}
